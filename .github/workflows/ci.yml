name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx eslint src --max-warnings=0

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx jest --ci --coverage

  # 🐳 Docker image build bo'lishini tekshirish (push qilinmaydi)
  build:
    name: Docker build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Notify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: production
    needs: [lint, typecheck, test, build]
    if: always()
    # Telegram xatosi CI'ni qizil qilmasin — aks holda CD (workflow_run success) skip bo'ladi.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      # Every value goes through env, never ${{ }} inside run: (script injection).
      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.PR_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.PR_DEV_GROUP_ID }}
          TOPIC_ID: ${{ vars.PR_TOPIC_ID }}
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          # Docker build faqat PR'da ishlaydi; push'da ko'rsatilmaydi
          BUILD: ${{ github.event_name == 'pull_request' && needs.build.result || '' }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          COMMIT_URL: ${{ github.event.head_commit.url || github.event.pull_request.html_url }}
        run: bash .github/script/notify-telegram.sh
