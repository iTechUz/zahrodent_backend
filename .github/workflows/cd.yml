name: CD

# Faqat CI main'dagi push uchun muvaffaqiyatli tugaganda ishlaydi.
# Stages: build (image + Trivy + Docker Hub push) -> prepare (.env + pull) -> migrate (prisma)
#         -> deploy (run + health check, xato bo'lsa eski image'ga rollback) -> notify
# production environment (env4ci): SERVER_HOST, SERVER_USER, DOCKERHUB_USERNAME,
#   IMAGE_NAME, CONTAINER_NAME, DOCKER_NETWORK, SSH_PRIVATE_KEY, DOCKERHUB_TOKEN + .env kalitlari
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CONTAINER: ${{ vars.CONTAINER_NAME }}
      NETWORK: ${{ vars.DOCKER_NETWORK }}
    steps:
      # Tag = qisqa commit sha (7 belgi), masalan 10449/zahrodent_backend:8d777fa
      - name: Set image
        run: echo "IMAGE=$IMAGE_NAME:${SHA::7}" >> "$GITHUB_ENV"

      - name: Check variables
        run: |
          missing=""
          for k in SERVER_HOST SERVER_USER CONTAINER NETWORK; do [ -z "${!k}" ] && missing="$missing $k"; done
          [ -z "$IMAGE_NAME" ] && missing="$missing IMAGE_NAME"
          if [ -n "$missing" ]; then echo "::error::production environment'da yo'q:$missing"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fix'i bor CRITICAL zaiflik bo'lsa to'xtaydi; HIGH va fix'siz — faqat log.
      - name: Trivy scan
        run: |
          trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.75.0 "$@"
          }
          trivy image --scanners vuln --no-progress --severity HIGH,CRITICAL --exit-code 0 "$IMAGE"
          trivy image --scanners vuln --no-progress --skip-db-update --ignore-unfixed \
            --severity CRITICAL --exit-code 1 "$IMAGE"

      - name: Docker push
        run: |
          LATEST="${IMAGE%:*}:latest"
          docker tag "$IMAGE" "$LATEST"
          docker push "$IMAGE"
          docker push "$LATEST"

  prepare:
    name: Prepare
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CONTAINER: ${{ vars.CONTAINER_NAME }}
      NETWORK: ${{ vars.DOCKER_NETWORK }}
      ENV_FILE: /home/ubuntu/zahrodent_backend/.env
    steps:
      # Tag = qisqa commit sha (7 belgi), masalan 10449/zahrodent_backend:8d777fa
      - name: Set image
        run: echo "IMAGE=$IMAGE_NAME:${SHA::7}" >> "$GITHUB_ENV"

      - name: Create .env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
          ESKIZ_EMAIL: ${{ secrets.ESKIZ_EMAIL }}
          ESKIZ_PASSWORD: ${{ secrets.ESKIZ_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PORT: ${{ vars.PORT }}
          HOST: ${{ vars.HOST }}
          NODE_ENV: ${{ vars.NODE_ENV }}
          TZ: ${{ vars.TZ }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          TRUST_PROXY: ${{ vars.TRUST_PROXY }}
          SWAGGER_ENABLED: ${{ vars.SWAGGER_ENABLED }}
          LOG_FORMAT: ${{ vars.LOG_FORMAT }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
          REFRESH_TOKEN_TTL_DAYS: ${{ vars.REFRESH_TOKEN_TTL_DAYS }}
          INITIAL_ADMIN_PHONE: ${{ vars.INITIAL_ADMIN_PHONE }}
          INITIAL_ADMIN_NAME: ${{ vars.INITIAL_ADMIN_NAME }}
          ESKIZ_FROM: ${{ vars.ESKIZ_FROM }}
          ESKIZ_BASE_URL: ${{ vars.ESKIZ_BASE_URL }}
          ESKIZ_HTTP_TIMEOUT_MS: ${{ vars.ESKIZ_HTTP_TIMEOUT_MS }}
          TELEGRAM_BOT_ENABLED: ${{ vars.TELEGRAM_BOT_ENABLED }}
        run: |
          umask 077
          missing=""
          for k in DATABASE_URL JWT_SECRET CORS_ORIGINS INITIAL_ADMIN_PHONE INITIAL_ADMIN_PASSWORD; do
            [ -z "${!k}" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::production environment'da yo'q:$missing"
            exit 1
          fi
          for k in DATABASE_URL JWT_SECRET INITIAL_ADMIN_PASSWORD ESKIZ_EMAIL ESKIZ_PASSWORD TELEGRAM_BOT_TOKEN PORT HOST NODE_ENV TZ CORS_ORIGINS PUBLIC_BASE_URL TRUST_PROXY SWAGGER_ENABLED LOG_FORMAT JWT_EXPIRES_IN REFRESH_TOKEN_TTL_DAYS INITIAL_ADMIN_PHONE INITIAL_ADMIN_NAME ESKIZ_FROM ESKIZ_BASE_URL ESKIZ_HTTP_TIMEOUT_MS TELEGRAM_BOT_ENABLED; do
            if [ -n "${!k}" ]; then printf '%s=%s\n' "$k" "${!k}"; fi
          done > app.env
          echo "$(wc -l < app.env) ta kalit yozildi"

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id\n' "$SERVER_HOST" "$SERVER_USER" > ~/.ssh/config

      # Eski .env .env.bak sifatida saqlanadi (qo'lda qaytarish uchun).
      - name: Upload .env
        run: |
          # shellcheck disable=SC2029 # ENV_FILE runner'da ochiladi (ataylab)
          ssh server "set -e; umask 077; mkdir -p \"\$(dirname '$ENV_FILE')\"; if [ -f '$ENV_FILE' ]; then cp '$ENV_FILE' '$ENV_FILE.bak'; fi; cat > '$ENV_FILE'" < app.env
          rm -f app.env

      - name: Docker pull
        run: |
          # shellcheck disable=SC2029 # IMAGE runner'da ochiladi (ataylab)
          ssh server "docker pull '$IMAGE'"

  migrate:
    name: Migrate
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CONTAINER: ${{ vars.CONTAINER_NAME }}
      NETWORK: ${{ vars.DOCKER_NETWORK }}
      ENV_FILE: /home/ubuntu/zahrodent_backend/.env
    steps:
      # Tag = qisqa commit sha (7 belgi), masalan 10449/zahrodent_backend:8d777fa
      - name: Set image
        run: echo "IMAGE=$IMAGE_NAME:${SHA::7}" >> "$GITHUB_ENV"

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id\n' "$SERVER_HOST" "$SERVER_USER" > ~/.ssh/config

      # Yangi image bilan `prisma migrate deploy` (faqat pending migratsiyalar).
      # Xato bo'lsa deploy qilinmaydi — eski container ishlashda davom etadi.
      - name: Prisma migrate deploy
        run: |
          # shellcheck disable=SC2029 # qiymatlar runner'da ochiladi (ataylab)
          ssh server "docker run --rm --network '$NETWORK' --env-file '$ENV_FILE' '$IMAGE' ./node_modules/.bin/prisma migrate deploy"

  deploy:
    name: Deploy
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CONTAINER: ${{ vars.CONTAINER_NAME }}
      NETWORK: ${{ vars.DOCKER_NETWORK }}
      ENV_FILE: /home/ubuntu/zahrodent_backend/.env
    steps:
      # Tag = qisqa commit sha (7 belgi), masalan 10449/zahrodent_backend:8d777fa
      - name: Set image
        run: echo "IMAGE=$IMAGE_NAME:${SHA::7}" >> "$GITHUB_ENV"

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id\n' "$SERVER_HOST" "$SERVER_USER" > ~/.ssh/config

      # Health check o'tmasa oldingi image bilan container qayta ko'tariladi.
      - name: Deploy
        run: |
          # shellcheck disable=SC2029 # qiymatlar runner'da ochiladi (ataylab)
          ssh server "IMAGE='$IMAGE' CONTAINER='$CONTAINER' ENV_FILE='$ENV_FILE' NETWORK='${NETWORK:-}' bash -s" << 'EOF'
            set -u
            PREV=$(docker inspect -f '{{.Config.Image}}' "$CONTAINER" 2>/dev/null || true)
            echo "Oldingi image: ${PREV:-none}"
            run() {
              docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
              docker run -d --name "$CONTAINER" --restart unless-stopped \
                ${NETWORK:+--network "$NETWORK"} \
                -p 127.0.0.1:7878:7878 \
                --env-file "$ENV_FILE" "$1" >/dev/null
            }
            healthy() {
              for _ in $(seq 1 30); do
                curl -fsS http://127.0.0.1:7878/health >/dev/null 2>&1 && return 0
                sleep 3
              done
              return 1
            }
            run "$IMAGE"
            if healthy; then echo "✅ Healthy: $IMAGE"; exit 0; fi
            echo "❌ Health check failed"
            docker logs --tail 100 "$CONTAINER"
            if [ -n "$PREV" ]; then
              echo "↩️ Rollback: $PREV"
              [ -f "$ENV_FILE.bak" ] && cp "$ENV_FILE.bak" "$ENV_FILE"
              run "$PREV"
              healthy && echo "Rollback healthy" || echo "Rollback ham ishlamadi!"
            fi
            exit 1
          EOF

      - name: Cleanup
        run: ssh server 'docker image prune -af --filter "until=168h" >/dev/null || true'

  notify:
    name: Notify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: production
    needs: [build, prepare, migrate, deploy]
    if: always() && needs.build.result != 'skipped'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      # Every value goes through env, never ${{ }} inside run: (script injection).
      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.PR_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.PR_DEV_GROUP_ID }}
          TOPIC_ID: ${{ vars.PR_TOPIC_ID }}
          WORKFLOW: CD
          BUILD: ${{ needs.build.result }}
          PREPARE: ${{ needs.prepare.result }}
          MIGRATE: ${{ needs.migrate.result }}
          DEPLOY: ${{ needs.deploy.result }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          ACTOR: ${{ github.event.workflow_run.actor.login || github.actor }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message || 'manual deploy' }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha || github.sha }}
        run: bash .github/script/notify-telegram.sh
