name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      branch:
        description: "Deploy qilinadigan branch"
        required: true
        type: choice
        options:
          - dev
          - main

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || inputs.branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        contains(fromJSON('["main","dev"]'), github.event.workflow_run.head_branch)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ (github.event.workflow_run.head_branch || inputs.branch || github.ref_name) == 'dev' && 'dev' || 'production' }}
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CONTAINER: ${{ vars.CONTAINER_NAME }}
      NETWORK: ${{ vars.DOCKER_NETWORK }}
      BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch || github.ref_name }}

    steps:
      - name: Set image
        run: |
          echo "IMAGE=$IMAGE_NAME:${SHA::7}" >> "$GITHUB_ENV"

      - name: Check variables
        run: |
          missing=""
          for k in SERVER_HOST SERVER_USER CONTAINER NETWORK IMAGE_NAME; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::${BRANCH} environment'da yo'q:$missing"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.branch || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        run: |
          trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.75.0 "$@"
          }
          trivy image --scanners vuln --no-progress \
            --severity HIGH,CRITICAL --exit-code 0 "$IMAGE"
          trivy image --scanners vuln --no-progress --skip-db-update \
            --ignore-unfixed --severity CRITICAL --exit-code 1 "$IMAGE"

      - name: Docker push
        run: |
          if [ "$BRANCH" = "dev" ]; then
            TAG="${IMAGE_NAME}:dev-latest"
          else
            TAG="${IMAGE_NAME}:latest"
          fi
          docker tag "$IMAGE" "$TAG"
          docker push "$IMAGE"
          docker push "$TAG"

  prepare:
    name: Prepare
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ (github.event.workflow_run.head_branch || inputs.branch || github.ref_name) == 'dev' && 'dev' || 'production' }}
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      NETWORK: ${{ vars.DOCKER_NETWORK }}
      ENV_FILE: ${{ (github.event.workflow_run.head_branch || inputs.branch || github.ref_name) == 'dev' && '/home/ubuntu/zahrodent_backend-dev/.env' || '/home/ubuntu/zahrodent_backend/.env' }}
      BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch || github.ref_name }}

    steps:
      - name: Set image
        run: echo "IMAGE=$IMAGE_NAME:${SHA::7}" >> "$GITHUB_ENV"

      - name: Create .env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
          ESKIZ_EMAIL: ${{ secrets.ESKIZ_EMAIL }}
          ESKIZ_PASSWORD: ${{ secrets.ESKIZ_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PORT: ${{ vars.PORT }}
          HOST: ${{ vars.HOST }}
          NODE_ENV: ${{ vars.NODE_ENV }}
          TZ: ${{ vars.TZ }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          TRUST_PROXY: ${{ vars.TRUST_PROXY }}
          SWAGGER_ENABLED: ${{ vars.SWAGGER_ENABLED }}
          LOG_FORMAT: ${{ vars.LOG_FORMAT }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
          REFRESH_TOKEN_TTL_DAYS: ${{ vars.REFRESH_TOKEN_TTL_DAYS }}
          INITIAL_ADMIN_PHONE: ${{ vars.INITIAL_ADMIN_PHONE }}
          INITIAL_ADMIN_NAME: ${{ vars.INITIAL_ADMIN_NAME }}
          ESKIZ_FROM: ${{ vars.ESKIZ_FROM }}
          ESKIZ_BASE_URL: ${{ vars.ESKIZ_BASE_URL }}
          ESKIZ_HTTP_TIMEOUT_MS: ${{ vars.ESKIZ_HTTP_TIMEOUT_MS }}
          TELEGRAM_BOT_ENABLED: ${{ vars.TELEGRAM_BOT_ENABLED }}

        run: |
          set -eu
          umask 077

          missing=""
          for k in DATABASE_URL JWT_SECRET INITIAL_ADMIN_PASSWORD CORS_ORIGINS INITIAL_ADMIN_PHONE PORT; do
            [ -n "${!k}" ] || missing="$missing $k"
          done

          if [ -n "$missing" ]; then
            echo "::error::${BRANCH} environment'da yo'q:$missing"
            exit 1
          fi

          for k in DATABASE_URL JWT_SECRET INITIAL_ADMIN_PASSWORD ESKIZ_EMAIL ESKIZ_PASSWORD TELEGRAM_BOT_TOKEN PORT HOST NODE_ENV TZ CORS_ORIGINS PUBLIC_BASE_URL TRUST_PROXY SWAGGER_ENABLED LOG_FORMAT JWT_EXPIRES_IN REFRESH_TOKEN_TTL_DAYS INITIAL_ADMIN_PHONE INITIAL_ADMIN_NAME ESKIZ_FROM ESKIZ_BASE_URL ESKIZ_HTTP_TIMEOUT_MS TELEGRAM_BOT_ENABLED; do
            if [ -n "${!k:-}" ]; then
              printf '%s=%s\n' "$k" "${!k}"
            fi
          done > app.env

          echo "$(wc -l < app.env) ta kalit yozildi"

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          [ -n "$SSH_KEY" ] || {
            echo "::error::SSH_PRIVATE_KEY topilmadi"
            exit 1
          }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id\n  StrictHostKeyChecking yes\n' \
            "$SERVER_HOST" "$SERVER_USER" > ~/.ssh/config

      - name: Upload .env
        run: |
          set -eu
          ssh server "set -e; umask 077; mkdir -p \"\$(dirname '$ENV_FILE')\"; if [ -f '$ENV_FILE' ]; then cp '$ENV_FILE' '$ENV_FILE.bak'; fi; cat > '$ENV_FILE'" < app.env
          rm -f app.env

      - name: Docker pull
        run: ssh server "docker pull '$IMAGE'"

  migrate:
    name: Migrate
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ (github.event.workflow_run.head_branch || inputs.branch || github.ref_name) == 'dev' && 'dev' || 'production' }}
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      NETWORK: ${{ vars.DOCKER_NETWORK }}
      ENV_FILE: ${{ (github.event.workflow_run.head_branch || inputs.branch || github.ref_name) == 'dev' && '/home/ubuntu/zahrodent_backend-dev/.env' || '/home/ubuntu/zahrodent_backend/.env' }}

    steps:
      - name: Set image
        run: echo "IMAGE=$IMAGE_NAME:${SHA::7}" >> "$GITHUB_ENV"

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id\n  StrictHostKeyChecking yes\n' \
            "$SERVER_HOST" "$SERVER_USER" > ~/.ssh/config

      - name: Prisma migrate deploy
        run: |
          ssh server "docker run --rm --network '$NETWORK' --env-file '$ENV_FILE' '$IMAGE' ./node_modules/.bin/prisma migrate deploy"

  deploy:
    name: Deploy
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ (github.event.workflow_run.head_branch || inputs.branch || github.ref_name) == 'dev' && 'dev' || 'production' }}
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CONTAINER: ${{ vars.CONTAINER_NAME }}
      NETWORK: ${{ vars.DOCKER_NETWORK }}
      PORT: ${{ vars.PORT }}
      ENV_FILE: ${{ (github.event.workflow_run.head_branch || inputs.branch || github.ref_name) == 'dev' && '/home/ubuntu/zahrodent_backend-dev/.env' || '/home/ubuntu/zahrodent_backend/.env' }}

    steps:
      - name: Set image
        run: echo "IMAGE=$IMAGE_NAME:${SHA::7}" >> "$GITHUB_ENV"

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id\n  StrictHostKeyChecking yes\n' \
            "$SERVER_HOST" "$SERVER_USER" > ~/.ssh/config

      - name: Deploy
        run: |
          set -eu
          [ -n "$PORT" ] || {
            echo "::error::PORT environment variable topilmadi"
            exit 1
          }

          ssh server "IMAGE='$IMAGE' CONTAINER='$CONTAINER' ENV_FILE='$ENV_FILE' NETWORK='$NETWORK' APP_PORT='$PORT' bash -s" <<'EOF'
            set -eu

            PREV=$(docker inspect -f '{{.Config.Image}}' "$CONTAINER" 2>/dev/null || true)
            echo "Oldingi image: ${PREV:-none}"

            run() {
              docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
              docker run -d --name "$CONTAINER" --restart unless-stopped \
                --network "$NETWORK" \
                -p "127.0.0.1:${APP_PORT}:${APP_PORT}" \
                --env-file "$ENV_FILE" "$1" >/dev/null
            }

            healthy() {
              for _ in $(seq 1 30); do
                if curl -fsS "http://127.0.0.1:${APP_PORT}/health" >/dev/null 2>&1; then
                  return 0
                fi
                sleep 3
              done
              return 1
            }

            run "$IMAGE"

            if healthy; then
              echo "Healthy: $IMAGE"
              exit 0
            fi

            echo "Health check failed"
            docker logs --tail 100 "$CONTAINER" || true

            if [ -n "$PREV" ]; then
              echo "Rollback: $PREV"
              if [ -f "$ENV_FILE.bak" ]; then
                cp "$ENV_FILE.bak" "$ENV_FILE"
              fi
              run "$PREV"
              if healthy; then
                echo "Rollback healthy"
              else
                echo "Rollback ham ishlamadi!"
              fi
            fi

            exit 1
          EOF

      - name: Cleanup
        run: ssh server 'docker image prune -af --filter "until=168h" >/dev/null || true'

  notify:
    name: Notify
    needs: [build, prepare, migrate, deploy]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: ${{ (github.event.workflow_run.head_branch || inputs.branch || github.ref_name) == 'dev' && 'dev' || 'production' }}
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.branch || github.sha }}

      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.PR_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.PR_DEV_GROUP_ID }}
          TOPIC_ID: ${{ vars.PR_TOPIC_ID }}
          WORKFLOW: CD
          BUILD: ${{ needs.build.result }}
          PREPARE: ${{ needs.prepare.result }}
          MIGRATE: ${{ needs.migrate.result }}
          DEPLOY: ${{ needs.deploy.result }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch || github.ref_name }}
          ACTOR: ${{ github.event.workflow_run.actor.login || github.actor }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message || 'manual deploy' }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha || github.sha }}
        run: bash .github/script/notify-telegram.sh
