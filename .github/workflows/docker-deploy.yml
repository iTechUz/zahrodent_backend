name: Deploy to Server

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # 🧪 Unit testlar — muvaffaqiyatsiz bo'lsa deploy qilinmaydi
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npx eslint src --max-warnings=0

      - name: Unit tests
        run: npx jest --ci --coverage

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🧠 SHORT SHA olish
      - name: Set image tag
        id: vars
        run: echo "SHA_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # 🐳 Docker login
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u 10449 --password-stdin
      # 🔨 Build & push
      - name: Build and push Docker image
        run: |
          docker build -t 10449/zahrodent_backend:${{ github.sha }} .
          docker push 10449/zahrodent_backend:${{ github.sha }}

      # 🔐 Deploy
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          SHA_TAG: ${{ github.sha }}
        with:
          host: 116.203.244.91
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Deploying commit: ${{ github.sha }}"

            docker pull 10449/zahrodent_backend:${{ github.sha }}
            docker rm -f zahrodent_backend || true

            docker run -d \
              --name zahrodent_backend \
              --restart unless-stopped \
              --network zaxro_network \
              -p 7878:7878 \
              --env-file /home/ubuntu/projects/zaxro_dent/backend/zahrodent_backend/.env \
              10449/zahrodent_backend:${{ github.sha }}
