# env4ci configuration (generated by "env4ci init").
# Tokens come from GITHUB_TOKEN / GITLAB_TOKEN / VAULT_TOKEN, never this file.

# Unmatched keys default to secret (safe). First matching rule wins.
default: secret
rules:
  - { pattern: "*SECRET*",   type: secret }
  - { pattern: "*PASSWORD*", type: secret }
  - { pattern: "*TOKEN*",    type: secret }
  - { pattern: "*KEY*",      type: secret }
  - { pattern: "APP_*",      type: variable }
  - { pattern: "LOG_*",      type: variable }
  - { pattern: "ENVIRONMENT", type: variable }
  - { pattern: "VITE_*",     type: variable }
  - { pattern: "PR_*_ID",    type: variable }
  - { pattern: "SERVER_*", type: variable }
  - { pattern: "DOCKERHUB_USERNAME", type: variable }
  - { pattern: "IMAGE_NAME", type: variable }
  - { pattern: "CONTAINER_NAME", type: variable }
  - { pattern: "PORT", type: variable }
  - { pattern: "HOST", type: variable }
  - { pattern: "NODE_ENV", type: variable }
  - { pattern: "TZ", type: variable }
  - { pattern: "CORS_ORIGINS", type: variable }
  - { pattern: "PUBLIC_BASE_URL", type: variable }
  - { pattern: "TRUST_PROXY", type: variable }
  - { pattern: "SWAGGER_ENABLED", type: variable }
  - { pattern: "JWT_EXPIRES_IN", type: variable }
  - { pattern: "REFRESH_TOKEN_TTL_DAYS", type: variable }
  - { pattern: "INITIAL_ADMIN_PHONE", type: variable }
  - { pattern: "INITIAL_ADMIN_NAME", type: variable }
  - { pattern: "ESKIZ_FROM", type: variable }
  - { pattern: "ESKIZ_BASE_URL", type: variable }
  - { pattern: "ESKIZ_HTTP_TIMEOUT_MS", type: variable }
  - { pattern: "TELEGRAM_BOT_ENABLED", type: variable }

# Branch -> environment. "env4ci push" on a branch writes to its environment.
branches:
  "main": production

# env4ci's own tokens/addresses (generated, gitignored).
auth_file: .github/env4ci.env

# One JSON line per push: who, when, where, which keys (never values). Commit it.
audit_log: env4ci-audit.jsonl

# Environment -> local file. Each file is gitignored; the folder stays tracked.
environments:
  production: .github/production.env

targets:
  github:
    repo: iTechUz/zahrodent_backend
