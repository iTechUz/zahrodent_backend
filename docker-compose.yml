services:
  db:
    image: postgres:15-alpine
    container_name: zahro_dental_dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zahro_dental_dev
      TZ: Asia/Tashkent
    ports:
      # Only reachable from the host itself — never expose Postgres publicly.
      - "127.0.0.1:5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zahro_dental"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zahro_network

  api:
    image: 10449/zahrodent_backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest_api_dev
    restart: always
    ports:
      - "7879:7879"
    environment:
      - PORT=7879
      - TZ=Asia/Tashkent
      # Docker tarmog'ida db xostiga ulanish uchun (localhost emas)
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/zahro_dental_dev?schema=public
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zahro_network

networks:
  backend:

volumes:
  pgdata: