name: PR Telegram Notification

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  notify:
    name: Notify Telegram group
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: production

    steps:
      - uses: actions/checkout@v7
      # Every value goes through env, never ${{ }} inside run: (script injection).
      # Fails the job if the message is not delivered.
      - name: Send message to Telegram topic
        env:
          BOT_TOKEN: ${{ secrets.PR_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.PR_DEV_GROUP_ID }}
          TOPIC_ID: ${{ vars.PR_TOPIC_ID }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO_NAME: ${{ github.repository }}
        run: python3 .github/script/notify-pr-telegram.py
